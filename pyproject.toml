[tool.poetry]
name = "mlops-data-gubeev"
version = "0.1.0"
description = "Практика 3: версионирование Iris и Wine с DVC и ClearML"
authors = ["Gubeev"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dvc = "3.59.2"
clearml = "1.18.0"
scikit-learn = "1.6.1"
pandas = "2.2.3"
# Фиксируем Git backend и файловые блокировки DVC для воспроизводимости на Windows.
scmrepo = "3.3.11"
dulwich = "0.22.8"
filelock = "3.32.7"
pathspec = "0.12.1"

[tool.poetry.group.notebook.dependencies]
nbclient = "0.10.2"
ipykernel = "6.29.5"

[build-system]
requires = ["poetry-core==2.1.1"]
build-backend = "poetry.core.masonry.api"
